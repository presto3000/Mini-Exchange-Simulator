version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  matching_engine:
    build:
      context: .
      dockerfile: docker/matching_engine.Dockerfile
    ports:
      - "9100:9100"
      - "9500:9500"   # trade event PUB feed
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka

  risk:
    build:
      context: .
      dockerfile: docker/risk.Dockerfile
    environment:
      MATCHING_ENGINE_HOST: matching_engine
      MATCHING_ENGINE_PORT: "9100"
    ports:
      - "9200:9200"
    depends_on:
      - matching_engine

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      GATEWAY_ORDER_PROCESSOR: remote
      RISK_HOST: risk
      RISK_PORT: "9200"
    ports:
      - "9000:9000"
    depends_on:
      - risk

  persistence:
    build:
      context: .
      dockerfile: docker/persistence.Dockerfile
    environment:
      MATCHING_ENGINE_HOST: matching_engine
      MATCHING_ENGINE_PUB_PORT: "9500"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - matching_engine
      - postgres
      - kafka

  market_data:
    build:
      context: .
      dockerfile: docker/market_data.Dockerfile
    environment:
      MATCHING_ENGINE_HOST: matching_engine
      MATCHING_ENGINE_PUB_PORT: "9500"
    ports:
      - "9600:9600"
    depends_on:
      - matching_engine
  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    environment:
      GATEWAY_HOST: gateway
      GATEWAY_PORT: "9000"
      MARKET_DATA_HOST: market_data
      MARKET_DATA_PORT: "9600"
    depends_on:
      - gateway
      - market_data
    stdin_open: true   # required for an interactive console app in Compose
    tty: true

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

volumes:
  pgdata: